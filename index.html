        "keywords": "舞台灯光, 光束, 包络, 直纹曲面, three.js, WebGL, 鸟巢, 演唱会, 视觉错觉"

  <body>
    <canvas id="scene"></canvas>
    <canvas id="overlay" aria-hidden="true"></canvas>
    <div id="hotspots" aria-label="场景内机位"></div>

    <header id="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name" id="intro-title"></span>
        <span class="brand-sub" id="intro-subtitle"></span>
      </div>
      <nav id="chapters" aria-label="演示章节">
        <span class="seq-head">
          章节 <span class="seq-head-en">CUE</span>
          <b class="seq-count" id="seq-count"></b>
        </span>
        <div class="seq-track" id="seq-track"></div>
        <span class="seq-title" id="seq-title"></span>
      </nav>
      <div class="topbar-status">
        <button id="freeze-btn" class="chip" type="button" aria-pressed="false">
          <span class="chip-key">空格</span>冻结
        </button>
        <span id="stats" class="readout" role="status"></span>
      </div>
    </header>

    <aside id="rail" aria-label="参数">
      <div class="rail-head">
        <h2>参数 <span class="rail-head-en">PROGRAMMER</span></h2>
        <button id="panel-toggle" class="icon-btn" type="button" aria-expanded="true" aria-label="折叠参数面板">
          ›
        </button>
      </div>
      <div id="panel-body"></div>
      <section id="plan-wrap">
        <div class="rail-sub">
          <h3>平面图 <span class="rail-head-en">PLOT</span></h3>
          <span class="rail-sub-hint">点机位飞过去 · 点灯位独奏</span>
        </div>
        <canvas id="plan" width="288" height="288" role="img" aria-label="舞台平面图：显示灯位与机位"></canvas>
        <div id="plan-views" class="plan-views" aria-label="特殊视角"></div>
        <p class="plan-tip">点空白处就站到那儿 · 按住可以走</p>
        <div id="plan-a11y" class="sr-only"></div>
      </section>
      <section id="cam-list" aria-label="机位"></section>
    </aside>

    <div id="encbar">
      <div id="encoders" aria-label="常用参数"></div>
      <div class="encbar-tail">
        <div id="timeline-wrap">
          <label for="timeline" class="enc-label">时间 <span class="enc-en">TIME</span></label>
          <input id="timeline" type="range" min="0" max="1" step="0.001" value="0" aria-label="时间轴" />
        </div>
        <div id="keyhelp">
          <kbd>空格</kbd>推进/冻结 <kbd>←</kbd><kbd>→</kbd>章节 <kbd>1</kbd>–<kbd>9</kbd>机位 <kbd>点灯</kbd>独奏
          <kbd>F</kbd>特写 <kbd>H</kbd>隐藏
        </div>
      </div>
    </div>

    <section id="npc" data-state="idle" data-mood="talk" aria-label="讲解">
      <div class="npc-box" role="button" tabindex="0" aria-describedby="npc-live">
        <div class="npc-portrait" aria-hidden="true">
          <svg class="npc-avatar" viewBox="0 0 72 72" width="72" height="72">
            <defs>
              <radialGradient id="npcBg" cx="50%" cy="34%" r="72%">
                <stop offset="0%" stop-color="#1d2634" />
                <stop offset="100%" stop-color="#0a0d14" />
              </radialGradient>
              <linearGradient id="npcBeam" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffc233" stop-opacity="0.34" />
                <stop offset="100%" stop-color="#ffc233" stop-opacity="0" />
              </linearGradient>
              <clipPath id="npcClip"><circle cx="36" cy="36" r="35" /></clipPath>
            </defs>
            <g clip-path="url(#npcClip)">
              <rect width="72" height="72" fill="url(#npcBg)" />
              <path d="M36 -6 L64 40 L8 40 Z" fill="url(#npcBeam)" />
              <path d="M8 72 q6 -18 28 -18 t28 18 z" fill="#161c27" />
              <path d="M27 56 l4 16 M45 56 l-4 16" stroke="#3a4459" stroke-width="2.4" fill="none" />
              <rect x="31.5" y="41" width="9" height="10" rx="3" fill="#b3805a" />
              <ellipse cx="36" cy="31" rx="12.4" ry="13.6" fill="#d3a077" />
              <path d="M23.6 29 q1.4 -13 12.4 -13 t12.4 13 q-3 -6.5 -12.4 -6.5 T23.6 29z" fill="#242a36" />
              <ellipse cx="30.6" cy="30.4" rx="1.5" ry="1.8" fill="#2a2016" />
              <ellipse cx="41.4" cy="30.4" rx="1.5" ry="1.8" fill="#2a2016" />
              <path
                d="M27.6 25.6 q3 -1.6 6 -0.2 M38.4 25.4 q3 -1.4 6 0.2"
                stroke="#2c2230"
                stroke-width="1.5"
                fill="none"
                stroke-linecap="round"
              />
              <ellipse class="npc-mouth" cx="36" cy="38.2" rx="3.2" ry="1.5" fill="#8d5b41" />
              <rect x="19.5" y="26" width="6.4" height="12" rx="3" fill="#232b3a" />
              <rect x="46.1" y="26" width="6.4" height="12" rx="3" fill="#232b3a" />
              <path d="M22.7 26 q13.3 -14 26.6 0" stroke="#232b3a" stroke-width="3.2" fill="none" />
              <path d="M25 34 q6 3 8 6.4" stroke="#2b3446" stroke-width="2" fill="none" stroke-linecap="round" />
              <circle class="npc-led" cx="33.4" cy="41" r="1.5" fill="#4dd9f0" />
            </g>
            <circle cx="36" cy="36" r="34.4" fill="none" stroke="#333a45" stroke-width="1.2" />
          </svg>
        </div>
        <div class="npc-main">
          <div class="npc-head">
            <span class="npc-name">老陆</span>
            <span class="npc-role">灯光总监</span>
            <span class="npc-progress" id="npc-progress"></span>
          </div>
          <p class="npc-text" id="npc-text" aria-hidden="true"></p>
          <p class="sr-only" id="npc-live" role="status" aria-live="polite"></p>
          <div class="npc-foot">
            <span class="npc-next" id="npc-next" aria-hidden="true">继续 <i>▼</i></span>
            <span class="npc-tools">
              <button id="npc-auto" class="mini-btn" type="button" aria-pressed="false">自动 <kbd>A</kbd></button>
              <button id="npc-collapse" class="mini-btn" type="button">收起 <kbd>C</kbd></button>
            </span>
          </div>
        </div>
      </div>
    </section>

    <button id="npc-restore" class="chip chip--float" type="button" hidden>展开讲解 <kbd>C</kbd></button>

        机位

      <button class="mb" type="button" data-sheet="params">
        <svg class="mb-ico" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M2.5 5.5h15M2.5 10h15M2.5 14.5h15" />
          <circle cx="6.5" cy="5.5" r="1.9" />
          <circle cx="13" cy="10" r="1.9" />
          <circle cx="8" cy="14.5" r="1.9" />
        </svg>

      </button>
      <button class="mb" type="button" data-act="freeze" aria-pressed="false">
        <svg class="mb-ico" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M7 4v12M13 4v12" />
        </svg>
        冻结
      </button>
    </nav>
